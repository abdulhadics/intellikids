<div class="p-4 child-div row">
  <div class="col-sm-10 col-md-8 col-lg-6">
    <form [formGroup]="form">
      <h5>Change your name</h5>
      <div class="mb-3">
        <input
          type="text"
          formControlName="firstName"
          id="firstName"
          class="form-control form-control-sm"
          placeholder="First name"
        />
        <div
          *ngIf="
            form.controls['firstName'].invalid &&
            (form.controls['firstName'].dirty ||
              form.controls['firstName'].touched)
          "
        >
          <div
            *ngIf="form.controls['firstName'].errors?.['required']"
            class="text-danger"
          >
            Please enter first name.
          </div>
          <div
            *ngIf="form.controls['firstName'].errors?.['pattern']"
            class="text-danger"
          >
            First name must contain alphabets only.
          </div>
        </div>
      </div>
      <div class="mb-3">
        <input
          type="text"
          formControlName="lastName"
          id="lastName"
          class="form-control form-control-sm"
          placeholder="Last name"
        />
        <div
          *ngIf="
            form.controls['lastName'].invalid &&
            (form.controls['lastName'].dirty ||
              form.controls['lastName'].touched)
          "
        >
          <div
            *ngIf="form.controls['lastName'].errors?.['required']"
            class="text-danger"
          >
            Please enter last name.
          </div>
          <div
            *ngIf="form.controls['lastName'].errors?.['pattern']"
            class="text-danger"
          >
            Last name must contain alphabets only.
          </div>
        </div>
      </div>
      <div class="mb-3">
        <button (click)="submit()" name="submit" class="submit_btn mb-2">
          Submit
        </button>
      </div>
    </form>
  </div>
  <div class="col-sm-10 col-md-8 col-lg-6 text-lg-center">
    <h5>Change avatar</h5>
    <div class="user text-center mt-3">
      <div
        class="dp position-relative"
        [ngStyle]="{
          'background-image':
            user && user.avatar
              ? 'url(' + user.avatar.url + ')'
              : 'url(' + '/assets/images/default-user-image.png' + ')'
        }"
      >
        <label class="edit position-absolute" for="upload"><i class="fa fa-pencil"></i></label>
        <input
          type="file"
          class="invisible"
          (change)="uploadImage($event)"
          id="upload"
        />
      </div>
    </div>
  </div>
</div>
