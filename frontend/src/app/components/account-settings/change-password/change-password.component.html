<div class="p-4 child-div row">
  <div class="col-sm-10 col-md-8 col-lg-6">
      <form [formGroup]="form">
          <h5>Create a new password</h5>
          <div class="mb-3">
            <input
              type="password"
              formControlName="oldPassword"
              id="oldPassword"
              class="form-control form-control-sm"
              placeholder="Old password"
            />
            <div
                *ngIf="
                  form.controls['oldPassword'].invalid &&
                  (form.controls['oldPassword'].dirty ||
                    form.controls['oldPassword'].touched)
                "
              >
              <div
              *ngIf="form.controls['oldPassword'].errors?.['required']"
              class="text-danger"
            >
              Please enter old password.
            </div>
              </div>
          </div>
          <div class="mb-3">
            <input
              type="password"
              formControlName="newPassword"
              id="newPassword"
              class="form-control form-control-sm"
              placeholder="New password"
            />
            <div
                *ngIf="
                  form.controls['newPassword'].invalid &&
                  (form.controls['newPassword'].dirty ||
                    form.controls['newPassword'].touched)
                "
              >
                <div
                  *ngIf="form.controls['newPassword'].errors?.['required']"
                  class="text-danger"
                >
                Please enter new password.
                </div>
                <div
                  *ngIf="form.controls['newPassword'].errors?.['minlength']"
                  class="text-danger"
                >
                  New password must be at least 8 characters long.
                </div>
              </div>
          </div>
          <div class="mb-3">
              <input
                type="password"
                formControlName="confirmNewPassword"
                id="confirmNewPassword"
                class="form-control form-control-sm"
                placeholder="Confirm new password"
              />
              <div
                  *ngIf="
                    form.controls['confirmNewPassword'].invalid &&
                    (form.controls['confirmNewPassword'].dirty ||
                      form.controls['confirmNewPassword'].touched)
                  "
                >
                  <div
                    *ngIf="form.controls['confirmNewPassword'].errors?.['required']"
                    class="text-danger"
                  >
                  Please confirm new password.
                  </div>
                  <div
                    *ngIf="form.controls['confirmNewPassword'].errors?.['minlength']"
                    class="text-danger"
                  >
                    New password must be at least 8 characters long.
                  </div>
                </div>
            </div>
          <div class="mb-3">
            <button
              (click)="submit()"
              name="submit"
              class="submit_btn mb-2"
            >
              Set Password
            </button>
          </div>
        </form>
  </div>
</div>
