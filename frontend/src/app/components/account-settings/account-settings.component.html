<div class="container parent-div">
  <span class="d-flex align-items-center"
    ><i class="an an-user an-2x px-2"></i>
    <h3 class="pt-2">Profile</h3></span
  >
  <ul ngbNav #nav="ngbNav" [(activeId)]="active" class="nav-tabs">
    <li [ngbNavItem]="1">
      <a ngbNavLink>Profile Info</a>
      <ng-template ngbNavContent>
        <app-profile-info></app-profile-info>
      </ng-template>
    </li>
    <li [ngbNavItem]="2">
      <a ngbNavLink>Email</a>
      <ng-template ngbNavContent>
        <app-emails></app-emails>
      </ng-template>
    </li>
    <li [ngbNavItem]="3">
      <a ngbNavLink>Change Password</a>
      <ng-template ngbNavContent>
        <app-change-password></app-change-password>
      </ng-template>
    </li>
  </ul>
  <div [ngbNavOutlet]="nav"></div>
</div>
