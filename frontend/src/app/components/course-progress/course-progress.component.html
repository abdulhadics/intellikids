<div class="form-loader" *ngIf="loading">
    <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading...</span>
    </div>
</div>

<div class="container-fluid py-5 px-5" *ngIf="!loading">
<div class="container my-4" *ngFor = "let course of courses">
    <div class="row bg-light py-2 px-2 "style="width:100%">
        <div class="col-6">
            <div class="course-display"><h4>{{course.name}}</h4></div>
            <div class="course-description">
                <!-- <div class="col-6"><span>Total Videos Watched : &nbsp;&nbsp;&nbsp;<b>{{course.watchedVideos}} / {{course.totalVideos}}</b></span></div> -->
                <div><span>Total Quizzes Completed : &nbsp;&nbsp;&nbsp;<b>{{course.completedQuiz}} / {{course.totalQuiz}}</b></span></div>
                <div><span>Total Videos: &nbsp;&nbsp;&nbsp;<b>{{course.totalVideos}}</b></span></div>
            </div>
        </div>
        <br><br>
        <div class="row">
            <div class="progress">
                <div
                    class="progress-bar"
                    role="progressbar"
                    [style]="'width: ' + (course.completedQuiz / course.totalQuiz * 100) + '%; background-color: ' + ((course.completedQuiz / course.totalQuiz * 100) >= 50 ? 'green' : 'red')"
                    [attr.aria-valuenow]="course.completedQuiz / course.totalQuiz"
                    aria-valuemin="0"
                    aria-valuemax="100"
                >
                {{ (course.completedQuiz/course.totalQuiz * 100) | number: '1.0-0' }}
                </div>
            </div>
        </div>
    </div>
</div>

</div>
